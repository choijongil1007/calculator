<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>macOS Calculator</title>
  <style>
    :root {
      --bg-color: #1c1c1e;
      --text-color: #ffffff;
      --num-btn: #5e5e5e;
      --num-btn-hover: #6e6e6e;
      --num-btn-active: #8e8e8e;
      --util-btn: #424242;
      --util-btn-hover: #525252;
      --util-btn-active: #727272;
      --op-btn: #ff9f0a;
      --op-btn-hover: #ffb13d;
      --op-btn-active: #fcc87e;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-color);
      user-select: none;
    }

    .calculator {
      width: 232px;
      background-color: var(--bg-color);
      border-radius: 12px;
      box-shadow: 0 50px 100px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 1px;
    }

    .header {
      display: flex;
      gap: 6px;
      padding: 12px 12px 6px 12px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .red { background-color: #ff5f56; }
    .yellow { background-color: #ffbd2e; }
    .green { background-color: #27c93f; }

    #display {
      height: 90px;
      padding: 0 16px 8px 16px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      font-size: 48px;
      font-weight: 300;
      letter-spacing: -1px;
      white-space: nowrap;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background-color: rgba(0,0,0,0.2);
    }

    button {
      border: none;
      height: 46px;
      font-size: 19px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: background-color 0.1s;
    }

    .btn-num { background-color: var(--num-btn); }
    .btn-num:hover { background-color: var(--num-btn-hover); }
    .btn-num:active { background-color: var(--num-btn-active); }

    .btn-util { background-color: var(--util-btn); }
    .btn-util:hover { background-color: var(--util-btn-hover); }
    .btn-util:active { background-color: var(--util-btn-active); }

    .btn-op { background-color: var(--op-btn); }
    .btn-op:hover { background-color: var(--op-btn-hover); }
    .btn-op:active { background-color: var(--op-btn-active); }
    
    .btn-op.active {
      background-color: white;
      color: var(--op-btn);
    }

    .double {
      grid-column: span 2;
      justify-content: flex-start;
      padding-left: 20px;
    }

    .footer-text {
      margin-top: 24px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="header">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    
    <div id="display">0</div>

    <div class="buttons">
      <button class="btn-util" id="clear">AC</button>
      <button class="btn-util" id="toggle-sign">+/-</button>
      <button class="btn-util" id="percent">%</button>
      <button class="btn-op" data-op="/">÷</button>

      <button class="btn-num" data-num="7">7</button>
      <button class="btn-num" data-num="8">8</button>
      <button class="btn-num" data-num="9">9</button>
      <button class="btn-op" data-op="*">×</button>

      <button class="btn-num" data-num="4">4</button>
      <button class="btn-num" data-num="5">5</button>
      <button class="btn-num" data-num="6">6</button>
      <button class="btn-op" data-op="-">−</button>

      <button class="btn-num" data-num="1">1</button>
      <button class="btn-num" data-num="2">2</button>
      <button class="btn-num" data-num="3">3</button>
      <button class="btn-op" data-op="+">+</button>

      <button class="btn-num double" data-num="0">0</button>
      <button class="btn-num" id="decimal">.</button>
      <button class="btn-op" id="equals">=</button>
    </div>
  </div>

  <div class="footer-text">Pure JavaScript Calculator</div>

  <script>
    (function() {
      let displayValue = '0';
      let firstOperand = null;
      let waitingForSecondOperand = false;
      let operator = null;

      const displayElement = document.getElementById('display');

      function updateDisplay() {
        if (!displayElement) return;
        
        let formattedValue = displayValue;
        if (displayValue !== 'Error' && displayValue !== 'NaN') {
          const num = parseFloat(displayValue);
          if (!isNaN(num)) {
            const parts = displayValue.split('.');
            const integerPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            formattedValue = integerPart + (parts.length > 1 ? '.' + parts[1] : '');
          }
        }

        displayElement.textContent = formattedValue;
        
        // Font size scaling
        const len = formattedValue.length;
        if (len <= 6) displayElement.style.fontSize = '48px';
        else if (len <= 9) displayElement.style.fontSize = '36px';
        else if (len <= 12) displayElement.style.fontSize = '28px';
        else displayElement.style.fontSize = '20px';

        const clearBtn = document.getElementById('clear');
        if (clearBtn) {
          clearBtn.textContent = (displayValue === '0' && operator === null) ? 'AC' : 'C';
        }
      }

      function inputDigit(digit) {
        if (waitingForSecondOperand) {
          displayValue = digit;
          waitingForSecondOperand = false;
        } else {
          displayValue = displayValue === '0' ? digit : displayValue + digit;
        }
        updateDisplay();
      }

      function inputDecimal() {
        if (waitingForSecondOperand) {
          displayValue = '0.';
          waitingForSecondOperand = false;
          updateDisplay();
          return;
        }
        if (!displayValue.includes('.')) {
          displayValue += '.';
          updateDisplay();
        }
      }

      function handleOperator(nextOperator) {
        const inputValue = parseFloat(displayValue);

        if (operator && waitingForSecondOperand) {
          operator = nextOperator;
          return;
        }

        if (firstOperand === null && !isNaN(inputValue)) {
          firstOperand = inputValue;
        } else if (operator) {
          const result = calculate(firstOperand, inputValue, operator);
          displayValue = String(result);
          firstOperand = result;
          updateDisplay();
        }

        waitingForSecondOperand = true;
        operator = nextOperator;
      }

      function calculate(first, second, op) {
        let result;
        if (op === '+') result = first + second;
        else if (op === '-') result = first - second;
        else if (op === '*') result = first * second;
        else if (op === '/') result = second === 0 ? 'Error' : first / second;
        else return second;

        if (typeof result === 'number') {
          return parseFloat(result.toPrecision(12));
        }
        return result;
      }

      function resetCalculator() {
        displayValue = '0';
        firstOperand = null;
        waitingForSecondOperand = false;
        operator = null;
        updateDisplay();
      }

      function toggleSign() {
        if (displayValue === '0') return;
        displayValue = displayValue.startsWith('-') ? displayValue.slice(1) : '-' + displayValue;
        updateDisplay();
      }

      function inputPercent() {
        const value = parseFloat(displayValue);
        displayValue = String(value / 100);
        updateDisplay();
      }

      // Button Events
      document.querySelectorAll('[data-num]').forEach(btn => {
        btn.addEventListener('click', () => inputDigit(btn.getAttribute('data-num')));
      });

      document.querySelectorAll('[data-op]').forEach(btn => {
        btn.addEventListener('click', () => handleOperator(btn.getAttribute('data-op')));
      });

      document.getElementById('clear').addEventListener('click', resetCalculator);
      document.getElementById('decimal').addEventListener('click', inputDecimal);
      document.getElementById('toggle-sign').addEventListener('click', toggleSign);
      document.getElementById('percent').addEventListener('click', inputPercent);
      document.getElementById('equals').addEventListener('click', () => {
        if (operator === null) return;
        const inputValue = parseFloat(displayValue);
        const result = calculate(firstOperand, inputValue, operator);
        displayValue = String(result);
        firstOperand = null;
        operator = null;
        waitingForSecondOperand = true;
        updateDisplay();
      });

      // Keyboard Support
      window.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
        if (e.key === '.') inputDecimal();
        if (e.key === '+') handleOperator('+');
        if (e.key === '-') handleOperator('-');
        if (e.key === '*') handleOperator('*');
        if (e.key === '/') handleOperator('/');
        if (e.key === 'Enter' || e.key === '=') {
          document.getElementById('equals').click();
        }
        if (e.key === 'Escape') resetCalculator();
        if (e.key === 'Backspace') {
          if (displayValue.length > 1) {
            displayValue = displayValue.slice(0, -1);
            if (displayValue === '-') displayValue = '0';
          } else {
            displayValue = '0';
          }
          updateDisplay();
        }
      });

      updateDisplay();
    })();
  </script>
</body>
</html>
