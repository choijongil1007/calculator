<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>macOS Calculator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
  <style>
    :root {
      --bg-color: #1c1c1e;
      --text-color: #ffffff;
      --num-btn: #5e5e5e;
      --num-btn-hover: #6e6e6e;
      --num-btn-active: #8e8e8e;
      --util-btn: #424242;
      --util-btn-hover: #525252;
      --util-btn-active: #727272;
      --op-btn: #ff9f0a;
      --op-btn-hover: #ffb13d;
      --op-btn-active: #fcc87e;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: var(--text-color);
    }

    .calculator {
      width: 232px;
      background-color: var(--bg-color);
      border-radius: 12px;
      box-shadow: 0 50px 100px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 1px;
      animation: fadeIn 0.4s ease-out;
      user-select: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      display: flex;
      gap: 6px;
      padding: 12px 12px 6px 12px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .red { background-color: #ff5f56; }
    .yellow { background-color: #ffbd2e; }
    .green { background-color: #27c93f; }

    #display {
      height: 90px;
      padding: 0 16px 8px 16px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      font-size: 48px;
      font-weight: 300;
      letter-spacing: -1px;
      white-space: nowrap;
      overflow: hidden;
      transition: font-size 0.1s ease;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background-color: rgba(0,0,0,0.2);
    }

    button {
      border: none;
      height: 46px;
      font-size: 19px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: background-color 0.1s;
    }

    .btn-num { background-color: var(--num-btn); }
    .btn-num:hover { background-color: var(--num-btn-hover); }
    .btn-num:active { background-color: var(--num-btn-active); }

    .btn-util { background-color: var(--util-btn); }
    .btn-util:hover { background-color: var(--util-btn-hover); }
    .btn-util:active { background-color: var(--util-btn-active); }

    .btn-op { background-color: var(--op-btn); }
    .btn-op:hover { background-color: var(--op-btn-hover); }
    .btn-op:active { background-color: var(--op-btn-active); }
    
    .btn-op.active {
      background-color: white;
      color: var(--op-btn);
    }

    .double {
      grid-column: span 2;
      justify-content: flex-start;
      padding-left: 20px;
    }

    .footer-text {
      margin-top: 24px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.2);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="header">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    
    <div id="display">0</div>

    <div class="buttons">
      <button class="btn-util" id="clear">AC</button>
      <button class="btn-util" id="toggle-sign">+/-</button>
      <button class="btn-util" id="percent">%</button>
      <button class="btn-op" data-op="/">÷</button>

      <button class="btn-num" data-num="7">7</button>
      <button class="btn-num" data-num="8">8</button>
      <button class="btn-num" data-num="9">9</button>
      <button class="btn-op" data-op="*">×</button>

      <button class="btn-num" data-num="4">4</button>
      <button class="btn-num" data-num="5">5</button>
      <button class="btn-num" data-num="6">6</button>
      <button class="btn-op" data-op="-">−</button>

      <button class="btn-num" data-num="1">1</button>
      <button class="btn-num" data-num="2">2</button>
      <button class="btn-num" data-num="3">3</button>
      <button class="btn-op" data-op="+">+</button>

      <button class="btn-num double" data-num="0">0</button>
      <button class="btn-num" id="decimal">.</button>
      <button class="btn-op" id="equals">=</button>
    </div>
  </div>

  <div class="footer-text">Pure JS macOS Calculator</div>

</body>
</html>
